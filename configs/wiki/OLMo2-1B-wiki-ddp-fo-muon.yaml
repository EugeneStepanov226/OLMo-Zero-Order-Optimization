# OLMo2-1B на wiki-датасете с оптимизатором FOMuon (первопорядковый Muon).
# DDP, 2 GPU.
#
# FOMuon — first-order Muon:
#   1. Стандартный backward → градиент g
#   2. Nesterov momentum:  buf = μ·buf + g;  g_eff = g + μ·buf
#   3. Newton-Schulz для 2-D матриц:  update = NS(g_eff)  (сингулярные значения → 1)
#   4. Стандартный SGD с Nesterov для 1-D параметров (нормы, байасы)
#   5. Обновление: W -= lr · update
#
# Один шаг = 1 forward + 1 backward (в отличие от ZO, которому нужно ≥2 forward).
#
# Рекомендуемый LR: 0.01–0.05 для 2-D матриц.
# Авторы оригинального Muon используют lr=0.02, momentum=0.95.
#
# Запуск:
#   uv run torchrun --nproc_per_node=2 scripts/train.py \
#       configs/wiki/OLMo2-1B-wiki-ddp-fo-muon.yaml
#
# global_train_batch_size=512 делится на 1, 2, 4, 8 GPU без остатка.
# При OOM уменьшайте device_train_microbatch_size (с 4 до 2 или 1).
#
# IPv6 / localhost:
#   export MASTER_ADDR=127.0.0.1

run_name: OLMo2-1B-wiki-ddp-fo-muon
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: zo-muon-new
  group: ${run_name}
  entity: andrey

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1024
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

compile: null

optimizer:
  name: fo_muon
  # NS нормирует сингулярные значения → lr устойчив к масштабу градиента.
  # Стандартные значения из оригинального Muon: lr=0.02, momentum=0.95.
  # Для языковых моделей рекомендуется начать с lr=0.02; при нестабильности
  # уменьшайте до 0.01 или включите fo_muon_max_grad_norm: 1.0.
  learning_rate: 0.02
  weight_decay: 0.1           # включён для борьбы с переобучением (train↓ val↑ у полного FO)
  fo_muon_momentum: 0.95
  fo_muon_nesterov: true
  fo_muon_ns_steps: 5
  fo_muon_max_grad_norm: null  # включите 1.0 при нестабильности

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 25000000
  t_max: 500000000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_dolma2.json
  truncate_direction: right

save_folder: ./runs/OLMo2-1B-wiki-ddp-fo-muon
save_overwrite: true

save_interval: 1000
save_interval_ephemeral: 1000
save_num_checkpoints_to_keep: 2
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: 2

load_path: null

global_train_batch_size: 12
device_train_microbatch_size: 4

max_duration: 500000000T

precision: amp_bf16

distributed_strategy: ddp

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0   # глобальный grad clip (train.py); дополнительно к fo_muon_max_grad_norm

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 1000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  - label: dolma_wiki-validation
    type: lm
    data:
      pad_direction: right
      num_workers: 4
      drop_last: true
      pin_memory: true
      prefetch_factor: 2
      persistent_workers: true
      memmap_dtype: uint32
      paths:
        - data/wikitext/validation/0_00000.npy

data:
  pad_direction: right
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - data/olmo-mix/train/00000_00000.npy
    - data/olmo-mix/train/00001_00000.npy
    - data/olmo-mix/train/00002_00000.npy
    - data/olmo-mix/train/00003_00000.npy
    - data/olmo-mix/train/00004_00000.npy
    - data/olmo-mix/train/00005_00000.npy
