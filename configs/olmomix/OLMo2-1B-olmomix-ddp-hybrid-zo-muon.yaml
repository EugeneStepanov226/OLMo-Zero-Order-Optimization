# OLMo2-1B на olmo-mix датасете, оптимизатор HybridZOMuon.
# Голова (ff_out) + эмбеддеры (wte, wpe) → FO AdamW (через _MixedFOZOTrainer в train.py).
# Нормы (norm) → FO AdamW (через hybrid_fo_param_patterns внутри HybridZOMuon).
# Всё остальное (attention, FFN матрицы) → ZOMuon (ZO).
#
# Отличие от OLMo2-1B-olmomix-ddp-zo-muon.yaml: нормы обучаются FO, а не ZO.
#
# Запуск:
#   uv run torchrun --nproc_per_node=1 --master_port=29519 scripts/train.py \
#       configs/olmomix/OLMo2-1B-olmomix-ddp-hybrid-zo-muon.yaml
#
# При OOM уменьшите device_train_microbatch_size.

run_name: OLMo2-1B-olmomix-ddp-hybrid-zo-muon
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: zo-muon-new
  group: ${run_name}
  entity: andrey

model:
  d_model: 896
  n_heads: 14
  n_layers: 16
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1024
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

compile: null

activation_checkpointing: whole_layer  # нужен для FO-backward (нормы)

optimizer:
  name: hybrid_zo_muon

  # --- ZO-тело (ZOMuon для 2D матриц attention/FFN) ---
  learning_rate: 2.0e-4
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: false
  metrics_log_interval: 1
  zo_eps: 1.0e-3
  zo_perturbation_mode: two_side
  zo_muon_rank: 64
  zo_muon_step_interval: 100
  zo_muon_num_samples: 4
  zo_muon_ns_steps: 5
  zo_muon_max_grad_norm: 1.0

  # --- FO-часть (AdamW для норм; голова+эмбеддинги забирает _MixedFOZOTrainer) ---
  hybrid_fo_param_patterns:
    - ff_out       # выходная голова LM (на практике уже забрана внешним AdamW)
    - norm         # все layer norm → FO
  hybrid_fo_lr: 1.0e-4
  hybrid_fo_betas: [0.9, 0.95]
  hybrid_fo_eps: 1.0e-8
  hybrid_fo_weight_decay: 0.1
  hybrid_fo_max_grad_norm: 1.0

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 25000000       # ~5% от 500M
  t_max: 500000000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_dolma2.json
  truncate_direction: right

save_folder: ./runs/OLMo2-1B-olmomix-ddp-hybrid-zo-muon
save_overwrite: true

save_interval: 500
save_interval_ephemeral: 500
save_num_checkpoints_to_keep: 2
save_interval_unsharded: 500
save_num_unsharded_checkpoints_to_keep: 2

load_path: null

global_train_batch_size: 12
device_train_microbatch_size: 4

max_duration: 500000000T

precision: amp_bf16

distributed_strategy: ddp

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 500
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  - label: dolma_wiki-validation
    type: lm
    data:
      pad_direction: right
      num_workers: 0
      drop_last: true
      pin_memory: false
      prefetch_factor: null
      persistent_workers: false
      memmap_dtype: uint32
      paths:
        - data/wikitext/validation/0_00000.npy

data:
  pad_direction: right
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - data/olmo-mix/train/00000_00000.npy
    - data/olmo-mix/train/00001_00000.npy
    - data/olmo-mix/train/00002_00000.npy
    - data/olmo-mix/train/00003_00000.npy
    - data/olmo-mix/train/00004_00000.npy
    - data/olmo-mix/train/00005_00000.npy
